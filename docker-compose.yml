# Local development stack for the headless CMS (admin.banosportatiles.net).
# Usage: bin/setup.sh (idempotent). Never used in production.
name: banosportatiles-cms

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run bin/setup.sh to generate backend/.env}
  WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', getenv_docker('WP_ENVIRONMENT_TYPE', 'local'));
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('DISALLOW_FILE_EDIT', true);
    define('DISABLE_WP_CRON', true);
    define('WP_POST_REVISIONS', 20);
    define('AUTOMATIC_UPDATER_DISABLED', true);
  WP_ENVIRONMENT_TYPE: local
  BP_FRONTEND_URL: ${BP_FRONTEND_URL:-http://localhost:4321}
  BP_CORS_ORIGINS: ${BP_CORS_ORIGINS:-}
  BP_LEADS_SECRET: ${BP_LEADS_SECRET:?Run bin/setup.sh to generate backend/.env}
  BP_PREVIEW_SECRET: ${BP_PREVIEW_SECRET:?Run bin/setup.sh to generate backend/.env}
  BP_DEPLOY_HOOK_URL: ${BP_DEPLOY_HOOK_URL:-}
  BP_LEADS_WEBHOOK_URL: ${BP_LEADS_WEBHOOK_URL:-}
  BP_LEADS_EMAIL: ${BP_LEADS_EMAIL:-true}
  BP_LEADS_EMAIL_TO: ${BP_LEADS_EMAIL_TO:-}
  BP_LEADS_EMAIL_CC: ${BP_LEADS_EMAIL_CC:-}
  # SMTP like Brevo (STARTTLS + AUTH), against the local Mailpit.
  BP_SMTP_HOST: ${BP_SMTP_HOST:-mailpit}
  BP_SMTP_PORT: ${BP_SMTP_PORT:-1025}
  BP_SMTP_SECURE: ${BP_SMTP_SECURE:-tls}
  BP_SMTP_USER: ${BP_SMTP_USER:-bp-smtp}
  BP_SMTP_PASS: ${BP_SMTP_PASS:?Run bin/setup.sh to generate backend/.env}
  BP_SMTP_FROM: ${BP_SMTP_FROM:-no-reply@banosportatiles.net}
  BP_SMTP_FROM_NAME: ${BP_SMTP_FROM_NAME:-BañosPortátiles.net}

x-wp-volumes: &wp-volumes
  - wp_data:/var/www/html
  - ./wp-content/plugins/bp-headless:/var/www/html/wp-content/plugins/bp-headless
  - ./wp-content/themes/bp-headless-theme:/var/www/html/wp-content/themes/bp-headless-theme

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run bin/setup.sh to generate backend/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run bin/setup.sh to generate backend/.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:${WP_IMAGE_TAG:-7.1-php8.4-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes: *wp-volumes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/wp-includes/images/blank.gif"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Real cron (DISABLE_WP_CRON=true), same model as production: run due events every minute.
  cron:
    image: wordpress:${WP_CLI_IMAGE_TAG:-cli-2.12-php8.4}
    restart: unless-stopped
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes: *wp-volumes
    entrypoint: ["sh", "-c", "while :; do wp core is-installed 2>/dev/null && wp cron event run --due-now --quiet 2>/dev/null; sleep 60; done"]

  # One-shot: self-signed certificate so Mailpit can offer STARTTLS (the Mailpit image has no openssl).
  mailpit-tls:
    image: wordpress:${WP_CLI_IMAGE_TAG:-cli-2.12-php8.4}
    user: "0:0"
    volumes:
      - mailpit_tls:/tls
    entrypoint:
      - sh
      - -c
      - >-
        [ -s /tls/cert.pem ] || openssl req -x509 -newkey rsa:2048 -nodes -days 3650
        -subj /CN=mailpit -addext subjectAltName=DNS:mailpit,DNS:localhost
        -keyout /tls/key.pem -out /tls/cert.pem 2>/dev/null; chmod 644 /tls/key.pem /tls/cert.pem

  # SMTP sink that behaves like Brevo: STARTTLS and authentication are mandatory.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    depends_on:
      mailpit-tls:
        condition: service_completed_successfully
    environment:
      MP_SMTP_TLS_CERT: /tls/cert.pem
      MP_SMTP_TLS_KEY: /tls/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH: "${BP_SMTP_USER:-bp-smtp}:${BP_SMTP_PASS:?Run bin/setup.sh to generate backend/.env}"
    volumes:
      - mailpit_tls:/tls:ro
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # One-off WP-CLI container: docker compose run --rm wpcli wp <command>
  wpcli:
    image: wordpress:${WP_CLI_IMAGE_TAG:-cli-2.12-php8.4}
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/bp-headless:/var/www/html/wp-content/plugins/bp-headless
      - ./wp-content/themes/bp-headless-theme:/var/www/html/wp-content/themes/bp-headless-theme
      - ./bin:/opt/bp/bin:ro
      - ${BP_SEED_DIR:-./seed-sample}:/opt/bp/seed:ro
      - ./dist:/opt/bp/dist

  # Test-only receiver for the deploy hook and the leads webhook (smoke tests).
  hook-sink:
    image: wordpress:${WP_CLI_IMAGE_TAG:-cli-2.12-php8.4}
    profiles: ["test"]
    user: "33:33"
    entrypoint: ["php", "-S", "0.0.0.0:9000", "/sink/router.php"]
    volumes:
      - ./tests/fixtures/hook-sink:/sink

volumes:
  db_data:
  wp_data:
  mailpit_tls:
